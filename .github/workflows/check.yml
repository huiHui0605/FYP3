name: Verify Campus Twin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check static/app.js
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --prefix tests/browser
      - name: Exercise the workspace in Chrome
        run: |
          python app.py &
          trap 'kill $!' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8000/health
          CHROME_BIN="$(command -v google-chrome)" npm test --prefix tests/browser
