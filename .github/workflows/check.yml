name: Verify Campus Twin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    name: Verify · ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: for module in static/*.js; do node --input-type=module --check < "$module" || exit 1; done
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --prefix tests/browser
      - name: Install browser engine
        if: matrix.engine != 'chromium'
        working-directory: tests/browser
        run: npx playwright-core install --with-deps "${{ matrix.engine }}"
      - name: Exercise the workspace
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          python app.py &
          trap 'kill $!' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8000/health
          CHROME_BIN="$(command -v google-chrome)" npm test --prefix tests/browser
